[package]
name = "tree-sitter-lrc"
description = "Tree-sitter grammars for parsing time lyrics files (.lrc extension)."
version = "0.1.0"
authors = ["pursvir"]
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "lrc"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://github.com/pursvir/tree-sitter-lrc"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
  "/LICENSE",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.26.9"
